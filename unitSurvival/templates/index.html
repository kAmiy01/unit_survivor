<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>単位サバイバル PRO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div id="damage-overlay"></div>

    <div id="login-screen" class="login-screen">
        <div class="top-bar-accent"></div>
        
        <div class="login-container">
            <div class="login-header">
                <h1 class="app-title">単位<span>サバイバル</span></h1>
                <div class="app-subtitle-wrapper">
                    <div class="line"></div>
                    <p class="app-subtitle">Academic Control System</p>
                    <div class="line"></div>
                </div>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label>学籍番号 / ID</label>
                    <input type="text" placeholder="2024-XXXX" required>
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    システム起動
                </button>
            </form>
        </div>
    </div>

    <div id="app-screen" class="app-screen hidden">
        
        <header class="app-header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-bar"></div>
                    <h1 class="brand-text">
                        単位<span>サバイバル</span>
                    </h1>
                </div>
                <button id="reset-btn" class="btn btn-secondary btn-sm">
                    初期化
                </button>
            </div>
        </header>

        <main class="app-main">
            <div id="view-dashboard" class="view-dashboard">
                <div id="course-list" class="course-list"></div>
                <div class="list-footer">
                    <div class="line"></div>
                    <p>End of List</p>
                </div>
            </div>

            <div id="view-calendar" class="view-calendar hidden">
                <div class="calendar-header">
                    <h2 id="calendar-month-display"></h2>
                    <div class="calendar-controls">
                         <button onclick="changeMonth(-1)" class="btn-icon"><i data-lucide="chevron-left"></i></button>
                         <button onclick="changeMonth(1)" class="btn-icon"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>

                <div class="calendar-wrapper">
                    <div class="calendar-weekdays">
                        <div class="day sun">日</div>
                        <div class="day">月</div>
                        <div class="day">火</div>
                        <div class="day">水</div>
                        <div class="day">木</div>
                        <div class="day">金</div>
                        <div class="day sat">土</div>
                    </div>
                    <div id="calendar-grid" class="calendar-grid">
                        </div>
                </div>

                <div id="daily-detail-panel" class="daily-detail-panel hidden">
                    <h3 class="detail-title"><span id="detail-date"></span> の予定</h3>
                    <div id="detail-list" class="detail-list"></div>
                </div>
            </div>
        </main>

        <button id="add-course-btn" class="btn-fab">
            <i data-lucide="plus"></i>
        </button>

        <nav class="bottom-nav">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item active">
                <div class="nav-icon-wrapper">
                    <div id="nav-indicator-dash" class="nav-indicator active"></div>
                    <i data-lucide="layers"></i>
                </div>
                <span class="nav-label">一覧</span>
            </button>
            
            <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-item">
                <div class="nav-icon-wrapper">
                    <div id="nav-indicator-cal" class="nav-indicator"></div>
                    <i data-lucide="calendar-days"></i>
                </div>
                <span class="nav-label">カレンダー</span>
            </button>
    
            <button class="nav-item disabled">
               <div class="nav-icon-wrapper">
                <i data-lucide="users"></i>
               </div>
              <span class="nav-label">共有</span>
            </button>
        </nav>
    </div>

    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">
                    <span class="status-dot"></span>
                    <span id="modal-title-text">設定モード</span>
                </h2>
                <button id="close-modal-btn" class="btn-icon-sm">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="edit-id">
                
                <div class="section">
                    <h3 class="section-title text-blue">授業情報</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>授業名</label>
                            <input type="text" id="edit-name" class="input-lg">
                        </div>
                        <div class="form-group">
                            <label>担当教員</label>
                            <input type="text" id="edit-professor">
                        </div>
                        <div class="form-group">
                            <label>教室</label>
                            <input type="text" id="edit-room">
                        </div>
                        <div class="form-group full-width">
                            <label>曜日・時限 (例: 月曜1限)</label>
                            <input type="text" id="edit-day" placeholder="月曜1限">
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title text-yellow">開講学期</h3>
                    <div class="panel-inset">
                        <div class="flex-center gap-2" id="term-checkboxes" style="display: flex; flex-wrap: wrap; justify-content: space-around;">
                            </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title text-red">サバイバル設定</h3>
                    <div class="panel-inset">
                        <div class="grid-2">
                            <div class="text-center">
                                <label>欠席上限</label>
                                <input type="number" id="edit-absentLimit" class="input-circle">
                            </div>
                            <div class="text-center">
                                <label>遅刻換算</label>
                                <div class="flex-center gap-2">
                                    <input type="number" id="edit-lateToAbsentRatio" class="input-circle">
                                    <span class="unit">:1</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title text-green">評価・分析</h3>
                    <div class="panel-outline">
                        <div class="range-group">
                            <label>楽単度</label>
                            <input type="range" id="edit-rating-fun" min="1" max="5" class="range-green">
                            <span id="val-fun" class="range-val text-green">3</span>
                        </div>
                        <div class="range-group">
                            <label>鬼単度</label>
                            <input type="range" id="edit-rating-strictness" min="1" max="5" class="range-red">
                            <span id="val-strictness" class="range-val text-red">3</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>メモ</label>
                    <textarea id="edit-memo"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button id="save-course-btn" class="btn btn-primary btn-block">
                    <i data-lucide="save"></i> 設定を保存
                </button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-dialog border-yellow">
            <div class="dialog-stripe bg-yellow"></div>
            <div class="dialog-body">
                <i data-lucide="alert-triangle" class="icon-lg text-yellow pulse"></i>
                <h3 class="dialog-title">確認</h3>
                <p id="confirm-message" class="dialog-msg">実行しますか？</p>
                <div class="dialog-actions">
                    <button id="confirm-cancel" class="btn btn-secondary">キャンセル</button>
                    <button id="confirm-ok" class="btn btn-yellow">実行</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reset-modal" class="modal-overlay hidden">
        <div class="modal-dialog border-red">
            <div class="dialog-stripe bg-red"></div>
            <div class="dialog-body">
                <div class="text-center mb-6">
                    <i data-lucide="shield-alert" class="icon-lg text-red pulse"></i>
                    <h3 class="dialog-title">セキュリティ警告</h3>
                    <p class="dialog-sub text-muted">データ初期化のため管理者パスワードが必要です。</p>
                </div>
                
                <div class="form-group">
                    <input type="password" id="reset-password" class="input-center" placeholder="PASSWORD">
                    <p id="reset-error" class="error-msg hidden">パスワードが間違っています</p>
                </div>
                
                <div class="dialog-actions">
                    <button id="reset-cancel" class="btn btn-secondary">中止</button>
                    <button id="reset-confirm-btn" class="btn btn-red">完全初期化</button>
                </div>
            </div>
        </div>
    </div>

    <div id="term-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">学期期間設定 (年度初め)</h2>
            </div>
            <div class="modal-body">
                <p class="text-muted" style="font-size:0.8rem; margin-bottom:1rem;">
                    各学期の開始日と終了日を設定してください。<br>
                    この設定外の日付には授業が表示されません。
                </p>
                <form id="term-form">
                    <div id="term-inputs-container"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="save-terms-btn" class="btn btn-primary btn-block">
                    設定を保存して開始
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
